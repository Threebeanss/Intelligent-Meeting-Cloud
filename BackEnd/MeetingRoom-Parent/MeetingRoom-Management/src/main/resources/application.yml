server:
  port: 8080
  address: 0.0.0.0
spring:
  #为了加载dev文件
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${room.datasource.driver-class-name}
      url: jdbc:mysql://${room.datasource.host}:${room.datasource.port}/${room.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${room.datasource.username}
      password: ${room.datasource.password}
  #文件上传的配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  cache:
    redis:
      time-to-live: 3600000
  redis:
    host: ${room.redis.host}
    port: ${room.redis.port}
    database: ${room.redis.database}
  mail:
    host: smtp.qq.com  # 邮件服务器地址（QQ邮箱为smtp.qq.com，163为smtp.163.com）
    port: 587           # 端口（TLS加密通常用587，SSL用465）
    username: 2281613734@qq.com  # 发送邮件的邮箱账号
    password: jbbhamiiekeweafc
    default-encoding: UTF-8 # 邮箱授权码（非登录密码，需在邮箱设置中开启SMTP并获取）
    properties:
      mail:
        smtp:
          auth: true     # 启用认证
          starttls:
            enable: true # 启用TLS加密
        debug: true
mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: debug
        controller: debug
        org.apache.ibatis.reflection: DEBUG

sky:
  jwt:
    user-secret-key: fydkd
    user-token-name: token
    user-ttl: 864000000000
    alioss:
      access-key-id: ${sky.alioss.access-key-id}
      endpoint: ${sky.alioss.endpoint}
      access-key-secret: ${sky.alioss.access-key-secret}
      bucket-name: ${sky.alioss.bucket-name}
pagehelper:
  helper-dialect: mysql # 对应你的数据库（如oracle、postgresql）
  reasonable: true # 页码<=0时查第1页，页码>总页数时查最后1页
  support-methods-arguments: true # 支持通过Mapper接口参数传递分页参数

